<title>Reset Password - StockGrid</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #f8f7fc;
    --surface: #ffffff;
    --text: #1e1b2e;
    --text-muted: #635f78;
    --accent: #4338ca;
    --accent-soft: #eeecfb;
    --border: #e3e1ee;
    --danger: #dc2626;
    --danger-soft: #fdecec;
    --success: #16a34a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131020;
      --surface: #1a1730;
      --text: #edebf7;
      --text-muted: #9c97b8;
      --accent: #8b7ff0;
      --accent-soft: #241f42;
      --border: #2c2846;
      --danger: #f87171;
      --danger-soft: #2e1a1a;
      --success: #4ade80;
    }
  }

  :root[data-theme="dark"] {
    --bg: #131020; --surface: #1a1730; --text: #edebf7;
    --text-muted: #9c97b8; --accent: #8b7ff0; --accent-soft: #241f42; --border: #2c2846;
    --danger: #f87171; --danger-soft: #2e1a1a; --success: #4ade80;
  }
  :root[data-theme="light"] {
    --bg: #f8f7fc; --surface: #ffffff; --text: #1e1b2e;
    --text-muted: #635f78; --accent: #4338ca; --accent-soft: #eeecfb; --border: #e3e1ee;
    --danger: #dc2626; --danger-soft: #fdecec; --success: #16a34a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }

  .card {
    max-width: 420px;
    width: 100%;
    margin: 1.5rem;
    padding: 2.5rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }

  .icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    margin-bottom: 0.4rem;
  }
  .icon.danger { background: var(--danger-soft); color: var(--danger); }

  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
  }

  p {
    margin: 0;
    color: var(--text-muted);
    max-width: 34ch;
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 0.4rem;
  }

  label {
    text-align: left;
    font-size: 0.85rem;
    color: var(--text-muted);
    display: block;
    margin-bottom: 0.3rem;
  }

  input[type="password"] {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    width: 100%;
    padding: 0.75rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 0.3rem;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  .error-text {
    color: var(--danger);
    font-size: 0.85rem;
    text-align: left;
    min-height: 1.2em;
  }

  .wordmark {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    font-weight: 600;
    color: var(--accent);
    font-size: 0.9rem;
    letter-spacing: 0.02em;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }

  .brand-mark .bar, .brand-mark .patch {
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes grid-grow-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes grid-grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .brand-mark .bar-indigo { animation: grid-grow-y 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
  .brand-mark .bar-amber  { animation: grid-grow-y 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both; }
  .brand-mark .bar-teal   { animation: grid-grow-x 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both; }
  .brand-mark .bar-pink   { animation: grid-grow-x 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both; }
  @media (prefers-reduced-motion: reduce) {
    .brand-mark .bar, .brand-mark .patch { animation: none !important; transform: none !important; opacity: 1 !important; }
  }
</style>

<div class="card" id="card">
  <div class="icon">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <h1 id="heading">Set a new password</h1>
  <p id="subtext">Choose a new password for your StockGrid account.</p>

  <form id="reset-form">
    <div>
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" minlength="6" required />
    </div>
    <div>
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" minlength="6" required />
    </div>
    <div class="error-text" id="error-text"></div>
    <button type="submit" id="submit-btn">SET NEW PASSWORD</button>
  </form>

  <span class="brand-group">
    <svg class="brand-mark" width="24" height="24" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="rotate(8 512 512)">
        <rect class="bar bar-teal" x="302" y="404" width="420" height="72" rx="36" fill="#14B8A6"/>
        <rect class="bar bar-pink" x="302" y="548" width="420" height="72" rx="36" fill="#FB7185"/>
        <rect class="bar bar-indigo" x="404" y="302" width="72" height="420" rx="36" fill="#4F46E5"/>
        <rect class="bar bar-amber" x="548" y="302" width="72" height="420" rx="36" fill="#F59E0B"/>
        <rect class="patch" x="404" y="404" width="72" height="72" fill="#14B8A6"/>
        <rect class="patch" x="548" y="548" width="72" height="72" fill="#FB7185"/>
      </g>
    </svg>
    <span class="wordmark">StockGrid</span>
  </span>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Anon key - safe to ship client-side, same key the app itself uses.
  // It has no access beyond what RLS policies explicitly grant.
  const supabase = createClient(
    'https://ihfuagjmkdjehndmrqnl.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZnVhZ2pta2RqZWhuZG1ycW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzM2NTYsImV4cCI6MjEwMDY0OTY1Nn0.-x75iKONO1iBrBqc0SzJh0EvpY1Rtzqs5uWAJRco-tE'
  );

  const card = document.getElementById('card');
  const heading = document.getElementById('heading');
  const subtext = document.getElementById('subtext');
  const form = document.getElementById('reset-form');
  const errorText = document.getElementById('error-text');
  const submitBtn = document.getElementById('submit-btn');
  const icon = card.querySelector('.icon');

  function showInvalidLink() {
    icon.classList.add('danger');
    icon.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>';
    heading.textContent = 'Link expired or invalid';
    subtext.textContent = 'This password reset link no longer works. Go back to the StockGrid app and request a new one from the sign-in screen.';
    form.remove();
  }

  function showSuccess() {
    icon.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    heading.textContent = 'Password updated';
    subtext.textContent = 'Your password has been changed. Go back to the StockGrid app and sign in with your new password.';
    form.remove();
  }

  // Supabase's client auto-parses the recovery tokens from the URL hash on
  // load (detectSessionInUrl defaults to true) and fires this event once
  // that session is actually established - waiting for it rather than
  // assuming the link was valid the instant the page loaded.
  let recoveryReady = false;
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
  });

  // If the link was already invalid/expired, Supabase redirects here with
  // an error in the hash instead of a valid recovery token - no
  // PASSWORD_RECOVERY event ever fires in that case. A few seconds is
  // plenty for a legitimate link (the check above is synchronous once the
  // module loads); this is just a way to show a clear message instead of a
  // form that will only fail once submitted.
  setTimeout(() => {
    if (!recoveryReady) showInvalidLink();
  }, 2500);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorText.textContent = '';

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password.length < 6) {
      errorText.textContent = 'Password must be at least 6 characters.';
      return;
    }
    if (password !== confirm) {
      errorText.textContent = 'Passwords do not match.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'SETTING PASSWORD...';

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      errorText.textContent = error.message || 'Something went wrong. Please try again.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'SET NEW PASSWORD';
      return;
    }

    showSuccess();
  });
</script>
