<title>Email Confirmed - StockGrid</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #f8f7fc;
    --surface: #ffffff;
    --text: #1e1b2e;
    --text-muted: #635f78;
    --accent: #4338ca;
    --accent-soft: #eeecfb;
    --border: #e3e1ee;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131020;
      --surface: #1a1730;
      --text: #edebf7;
      --text-muted: #9c97b8;
      --accent: #8b7ff0;
      --accent-soft: #241f42;
      --border: #2c2846;
    }
  }

  :root[data-theme="dark"] {
    --bg: #131020; --surface: #1a1730; --text: #edebf7;
    --text-muted: #9c97b8; --accent: #8b7ff0; --accent-soft: #241f42; --border: #2c2846;
  }
  :root[data-theme="light"] {
    --bg: #f8f7fc; --surface: #ffffff; --text: #1e1b2e;
    --text-muted: #635f78; --accent: #4338ca; --accent-soft: #eeecfb; --border: #e3e1ee;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }

  .card {
    max-width: 420px;
    margin: 1.5rem;
    padding: 2.5rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }

  .icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    margin-bottom: 0.4rem;
  }

  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
  }

  p {
    margin: 0;
    color: var(--text-muted);
    max-width: 34ch;
  }

  .wordmark {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    font-weight: 600;
    color: var(--accent);
    font-size: 0.9rem;
    letter-spacing: 0.02em;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }

  /* Brand mark: same locked geometry as assets/icon_source.svg in the app
     repo - four rounded bars woven into a tilted "#". */
  .brand-mark .bar, .brand-mark .patch {
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes grid-grow-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes grid-grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes grid-fade { from { opacity: 0; } to { opacity: 1; } }
  .brand-mark .bar-indigo { animation: grid-grow-y 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
  .brand-mark .bar-amber  { animation: grid-grow-y 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both; }
  .brand-mark .bar-teal   { animation: grid-grow-x 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both; }
  .brand-mark .bar-pink   { animation: grid-grow-x 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both; }
  /* Patches are drawn statically, not faded in on a timer - see
     stockgrid-home's index.html for why. */
  @media (prefers-reduced-motion: reduce) {
    .brand-mark .bar, .brand-mark .patch { animation: none !important; transform: none !important; opacity: 1 !important; }
  }
</style>

<div class="card">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Email confirmed</h1>
  <p>Your email address is verified. You can go back to the StockGrid app now.</p>
  <span class="brand-group">
    <svg class="brand-mark" width="24" height="24" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="rotate(8 512 512)">
        <rect class="bar bar-teal" x="302" y="404" width="420" height="72" rx="36" fill="#14B8A6"/>
        <rect class="bar bar-pink" x="302" y="548" width="420" height="72" rx="36" fill="#FB7185"/>
        <rect class="bar bar-indigo" x="404" y="302" width="72" height="420" rx="36" fill="#4F46E5"/>
        <rect class="bar bar-amber" x="548" y="302" width="72" height="420" rx="36" fill="#F59E0B"/>
        <rect class="patch" x="404" y="404" width="72" height="72" fill="#14B8A6"/>
        <rect class="patch" x="548" y="548" width="72" height="72" fill="#FB7185"/>
      </g>
    </svg>
    <span class="wordmark">StockGrid</span>
  </span>
</div>
